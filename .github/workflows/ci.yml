name: CI/CD Pipeline - DonaTu

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Check PHP syntax (lint)
        run: |
          find . -name "*.php" -not -path "./vendor/*" | \
          xargs -I{} php -l {} | grep -v "No syntax errors" && exit 1 || echo "All PHP files OK"

  php-style:
    name: PHP Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: phpcs

      - name: Run PHPCS
        run: |
          phpcs --standard=PSR12 --extensions=php \
            --ignore=vendor/ \
            --warning-severity=0 \
            . || true

  sql-validate:
    name: Validate SQL Schema
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: donatu_db
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - name: Import and validate SQL schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot donatu_db < database/donatu.sql
          echo "Schema imported successfully"
          mysql -h 127.0.0.1 -uroot -proot donatu_db -e "SHOW TABLES;"

  php-tests:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: donatu_db
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: xdebug
          tools: composer

      - name: Import DB schema
        run: mysql -h 127.0.0.1 -uroot -proot donatu_db < database/donatu.sql

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit with coverage
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: donatu_db
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage/clover.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: coverage/clover.xml
